<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <defs>
    <filter id="sticker-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="DILATED" />
      <feFlood flood-color="white" result="WHITE" />
      <feComposite in="WHITE" in2="DILATED" operator="in" result="OUTLINE" />
      <feMerge>
        <feMergeNode in="OUTLINE" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#sticker-outline)">
    <!-- Combined path for head and shoulders to avoid overlapping strokes -->
    <path d="M 100 25 C 125 25 145 45 145 70 C 145 92 129 110 108 114 C 140 120 170 150 170 240 L 30 240 C 30 150 60 120 92 114 C 71 110 55 92 55 70 C 55 45 75 25 100 25 Z" fill="#222" />
  </g>
</svg>
